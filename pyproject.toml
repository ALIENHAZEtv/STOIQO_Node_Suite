[project]
name = "stoiqo-comfyui-nodes"
version = "1.0.0"
description = "A production-ready ComfyUI custom node suite for Visual & Music Prompt Generation and Creative Utilities powered by Vision-Language Models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.45.0",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.43.0",
    "torch>=2.1.0",
    "torchvision",
    "Pillow>=10.0.0",
    "huggingface_hub>=0.20.0",
    "qwen-vl-utils>=0.0.2",
    "pyyaml",
    "tqdm",
    "numpy>=1.24.0",
    "safetensors>=0.4.2",
]

[project.urls]
Homepage = "https://github.com/ALIENHAZEtv/STOIQO_ComfyUI_Nodes"
Repository = "https://github.com/ALIENHAZEtv/STOIQO_ComfyUI_Nodes"

[tool.comfy]
PublisherId = "stoiqo"
DisplayName = "STOIQO ComfyUI Nodes"
Icon = ""
